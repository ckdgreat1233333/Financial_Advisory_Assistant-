<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClaimsGuard AI - Insurance Claims Processing Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#e2e8f0;min-height:100vh}
header{background:#1e293b;border-bottom:1px solid #1e293b;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{color:#fff;font-size:18px;display:flex;align-items:center;gap:8px}
header h1 span{background:#4f46e5;color:#c7d2fe;font-size:10px;padding:2px 8px;border-radius:12px}
.user-badge{display:flex;align-items:center;gap:10px;font-size:13px}
.user-badge .dot{width:8px;height:8px;border-radius:50%}
.dot.customer{background:#10b981}
.dot.officer{background:#818cf8}
.logout-btn{background:#334155;color:#94a3b8;border:1px solid #334155;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.logout-btn:hover{background:#475569;color:#fff}
.container{max-width:1200px;margin:0 auto;padding:20px}
.hidden{display:none!important}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn-primary{background:#059669;color:#fff}
.btn-primary:hover{background:#047857}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-approve{background:#059669;color:#fff}
.btn-reject{background:#dc2626;color:#fff}
.btn-outline{background:#334155;color:#94a3b8;border:1px solid #475569}
.btn-outline:hover{background:#475569;color:#fff}
.btn-indigo{background:#4f46e5;color:#fff}
.btn-indigo:hover{background:#4338ca}
.card{background:#1e293b;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:16px}
.card h3{font-size:14px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flex{display:flex}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gap-2{gap:8px}
.gap-3{gap:12px}
.mt-2{margin-top:8px}
.mt-3{margin-top:12px}
.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}
.text-xs{font-size:12px}
.text-sm{font-size:13px}
.text-lg{font-size:18px}
.text-slate{color:#94a3b8}
.text-white{color:#fff}
.text-emerald{color:#10b981}
.text-rose{color:#f43f5e}
.text-amber{color:#f59e0b}
.text-indigo{color:#818cf8}
.font-bold{font-weight:700}
.font-mono{font-family:'Courier New',monospace}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600;display:inline-block}
.badge-success{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.2)}
.badge-warning{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.badge-danger{background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.2)}
.badge-info{background:rgba(129,140,248,.15);color:#818cf8;border:1px solid rgba(129,140,248,.2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px;color:#64748b;font-weight:600;border-bottom:1px solid #1e293b}
td{padding:12px;border-bottom:1px solid #1e293b}
tr:hover{background:rgba(30,41,59,.5)}
input,select,textarea{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#059669}
label{font-size:12px;color:#94a3b8;display:block;margin-bottom:4px}
.progress-bar{height:6px;background:#0f172a;border-radius:4px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.progress-fill.green{background:#10b981}
.progress-fill.red{background:#f43f5e}
.progress-fill.amber{background:#f59e0b}
.auth-container{max-width:400px;margin:80px auto;text-align:center}
.auth-card{background:#1e293b;border:1px solid #1e293b;border-radius:16px;padding:32px;text-align:left;margin-top:20px}
.auth-card .logo{background:#059669;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px}
.auth-card h2{text-align:center;font-size:20px;margin-bottom:4px}
.auth-card p{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:20px}
.role-selector{display:flex;gap:8px;margin-bottom:16px}
.role-btn{flex:1;padding:10px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;cursor:pointer;font-size:13px;text-align:center;transition:all .15s}
.role-btn.active{background:rgba(5,150,105,.15);border-color:#059669;color:#10b981;font-weight:600}
.form-group{margin-bottom:14px}
.form-group input{background:#0f172a}
.stat-card{background:#1e293b;border:1px solid #1e293b;padding:16px;border-radius:16px}
.stat-card .num{font-size:24px;font-weight:700}
.stat-card .label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.tabs{display:flex;gap:4px;padding:4px;background:#0f172a;border-radius:10px;border:1px solid #1e293b;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:8px 14px;border-radius:8px;border:none;background:transparent;color:#94a3b8;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.tab-btn.active{background:#4f46e5;color:#fff}
.tab-btn:hover:not(.active){background:#1e293b;color:#e2e8f0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#1e293b;border:1px solid #1e293b;border-radius:16px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:12px}
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.detail-field{margin-bottom:8px}
.detail-field .label{font-size:11px;color:#64748b}
.detail-field .value{font-size:13px;color:#fff;font-weight:500}
.metric-box{background:#0f172a;padding:12px;border-radius:10px;border:1px solid #1e293b;text-align:center}
.metric-box .val{font-size:20px;font-weight:700}
.metric-box .lbl{font-size:10px;color:#64748b;text-transform:uppercase}
@media(max-width:768px){
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
.detail-grid{grid-template-columns:1fr}
}
.sidebar-layout{display:grid;grid-template-columns:240px 1fr;gap:20px}
.sidebar{display:flex;flex-direction:column;gap:4px}
.sidebar-btn{padding:10px 14px;border-radius:10px;border:none;background:transparent;color:#94a3b8;cursor:pointer;font-size:13px;text-align:left;transition:all .15s}
.sidebar-btn:hover{background:rgba(30,41,59,.5);color:#e2e8f0}
.sidebar-btn.active{background:#059669;color:#fff;font-weight:600}
@media(max-width:768px){.sidebar-layout{grid-template-columns:1fr}}
.chat-container{display:grid;grid-template-columns:2fr 1fr;gap:20px;height:calc(100vh - 220px);min-height:400px}
.chat-pane{display:flex;flex-direction:column;background:#1e293b;border:1px solid #1e2a3a;border-radius:16px;overflow:hidden}
.chat-header{background:#0f172a;border-bottom:1px solid #1e2a3a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.chat-header .ai-badge{background:#1a1b3a;border:1px solid #4f46e5;color:#818cf8;padding:2px 6px;border-radius:6px;font-size:9px;font-family:monospace}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.chat-msg{display:flex;gap:10px;max-width:85%;align-items:flex-start}
.chat-msg.user{flex-direction:row-reverse;margin-left:auto}
.chat-msg .avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chat-msg .avatar.user{background:#059669;color:#fff}
.chat-msg .avatar.ai{background:#1a1b3a;border:1px solid #4f46e5;color:#818cf8}
.chat-msg .bubble{padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.6;word-break:break-word}
.chat-msg.user .bubble{background:#1e2a3a;color:#f1f5f9;border:1px solid #334155}
.chat-msg.ai .bubble{background:#0f172a;color:#e2e8f0;border:1px solid #1e2a3a}
.chat-msg .meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:0 4px}
.chat-msg .timestamp{font-size:9px;color:#64748b}
.chat-msg .ground-link{font-size:9px;color:#818cf8;cursor:pointer}
.chat-input{padding:10px;background:#0f172a;border-top:1px solid #1e2a3a;display:flex;gap:8px}
.chat-input input{flex:1;background:#1e2a3a;border:1px solid #334155;border-radius:10px;padding:10px 14px;color:#fff;font-size:12px;outline:none}
.chat-input input:focus{border-color:#4f46e5}
.chat-input button{padding:10px;border-radius:10px;border:none;background:#4f46e5;color:#fff;cursor:pointer;font-size:14px;width:40px;flex-shrink:0}
.chat-input button:disabled{background:#1e2a3a;color:#64748b}
.chat-sidebar{background:#1e293b;border:1px solid #1e2a3a;border-radius:16px;padding:16px;display:flex;flex-direction:column}
.chat-sidebar h4{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.chat-sidebar .clause-box{background:#0f172a;border:1px solid #4f46e5;border-radius:10px;padding:14px;position:relative;margin-top:8px}
.chat-sidebar .clause-tag{position:absolute;right:8px;top:-8px;background:#1a1b3a;border:1px solid #4f46e5;color:#818cf8;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600}
.chat-sidebar .clause-name{font-size:12px;color:#e2e8f0;font-weight:600;font-family:monospace}
.chat-sidebar .clause-doc{font-size:11px;color:#94a3b8;margin:4px 0}
.chat-sidebar .clause-text{font-size:11px;color:#94a3b8;font-style:italic;background:#0f172a;padding:6px;border-radius:6px;border:1px solid #1e2a3a;margin:6px 0}
.chat-sidebar .clause-auth{font-size:10px;color:#10b981}
.reasoning-toggle summary{display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 0;font-size:10px;color:#64748b}
.reasoning-toggle summary:hover{color:#818cf8}
.reasoning-text{padding:8px;font-size:10px;color:#94a3b8;font-family:monospace;line-height:1.5;border-top:1px solid #1e2a3a;margin-top:2px}
@keyframes bounce{0%,100%{opacity:0.4}50%{opacity:1}}
.loading-dot{width:6px;height:6px;background:#818cf8;border-radius:50%;display:inline-block;animation:bounce .8s infinite}
.loading-dot:nth-child(2){animation-delay:.15s}
.loading-dot:nth-child(3){animation-delay:.3s}
@media(max-width:768px){.chat-container{grid-template-columns:1fr}}
.spinner{width:32px;height:32px;border:3px solid #1e293b;border-top-color:#059669;border-radius:50%;animation:spin .6s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.viewer-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200}
.viewer-modal .viewer-box{background:#1e293b;border-radius:12px;width:90%;height:90%;display:flex;flex-direction:column;overflow:hidden}
.viewer-modal .viewer-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #334155}
.viewer-modal .viewer-header span{font-size:13px;color:#e2e8f0;font-weight:600}
.viewer-modal .viewer-header button{background:#334155;border:none;color:#94a3b8;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.viewer-modal .viewer-header button:hover{background:#475569;color:#fff}
.viewer-modal iframe{flex:1;border:none;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = 'http://127.0.0.1:8000';
let state = { user: null, claims: [], logs: [], policyDocs: [], view: 'login', tab: 'overview', officerTab: 'queue', selectedClaimId: null, search: '', faqs: [], chatMessages: null, chatLoading: false, activeGrounding: null };

const CLAIM_TYPE_LABEL = { auto: 'Auto', health: 'Health', property: 'Property', fire: 'Fire', theft: 'Theft', liability: 'Liability', travel: 'Travel' };
const STATUS_BADGE = {
  received: '<span class="badge badge-info">Received</span>',
  under_review: '<span class="badge badge-warning">Under Review</span>',
  accepted: '<span class="badge badge-success">Accepted</span>',
  rejected: '<span class="badge badge-danger">Rejected</span>'
};
const COVERAGE_BADGE = {
  covered: '<span class="badge badge-success">Covered</span>',
  review_required: '<span class="badge badge-warning">Review Required</span>',
  failed: '<span class="badge badge-danger">Not Covered</span>'
};
const FRAUD_BADGE = {
  Low: '<span class="badge badge-success">Low Fraud Risk</span>',
  Medium: '<span class="badge badge-warning">Medium Fraud Risk</span>',
  High: '<span class="badge badge-danger">High Fraud Risk</span>',
  Unknown: '<span class="badge badge-info">Fraud Risk Pending</span>'
};

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (state.user) opts.headers['X-Portal-Role'] = state.user.role;
  if (body && !(body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  } else if (body instanceof FormData) {
    opts.body = body;
  }
  const res = await fetch(API + path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadData() {
  try {
    const emailParam = state.user && state.user.role === 'customer' && state.user.email ? `?email=${encodeURIComponent(state.user.email)}` : '';
    const [c, l, p, f] = await Promise.all([
      api('GET', `/api/claims${emailParam}`),
      api('GET', '/api/audit-logs'),
      api('GET', '/api/policy-documents'),
      api('GET', '/api/faq')
    ]);
    state.claims = c.claims || [];
    state.logs = l.logs || [];
    state.policyDocs = p.policyDocuments || [];
    state.faqs = f.faqs || [];
  } catch(e) { console.warn('Load error:', e); }
}

function formatCurrency(n) {
  return '₹' + Number(n).toLocaleString('en-IN');
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function showFileViewer(claimId, fileName) {
  const existing = document.getElementById('file-viewer-modal');
  if (existing) existing.remove();
  const url = API + '/api/claims/' + claimId + '/documents/' + encodeURIComponent(fileName) + '/file';
  const div = document.createElement('div');
  div.id = 'file-viewer-modal';
  div.className = 'viewer-modal';
  div.innerHTML = '<div class="viewer-box"><div class="viewer-header"><span>' + esc(fileName) + '</span><button id="viewer-close">Close</button></div><iframe src="' + url + '"></iframe></div>';
  div.addEventListener('click', (e) => { if (e.target === div) div.remove(); });
  document.body.appendChild(div);
  document.getElementById('viewer-close').addEventListener('click', () => div.remove());
}

// ─── Login ───
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="auth-container">
      <div style="background:#059669;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px;color:#fff;font-weight:700">CG</div>
      <h1 style="font-size:22px;margin-bottom:4px">ClaimsGuard AI</h1>
      <p style="color:#94a3b8;font-size:13px;margin-bottom:24px">Secure Claims Intelligence</p>
      <div class="auth-card">
        <h2>Sign In</h2>
        <p>Enter your credentials</p>
        <div class="role-selector" id="role-selector">
          <button class="role-btn active" data-role="customer">Customer</button>
          <button class="role-btn" data-role="officer">Claims Officer</button>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="your username" value="admin">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" value="admin123">
        </div>
        <button class="btn btn-primary" style="width:100%;padding:12px" id="login-btn">Sign In</button>
        <p style="text-align:center;margin-top:12px;font-size:12px;color:#64748b">New user? <a href="#" id="show-register" style="color:#10b981">Create account</a></p>
      </div>
    </div>`;

  let role = 'customer';
  document.querySelectorAll('.role-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    role = b.dataset.role;
  }));

  document.getElementById('login-btn').addEventListener('click', async () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) return alert('Please enter username and password');
    try {
      const res = await api('POST', '/api/auth/login', { username, password, portalType: role });
      state.user = res.user;
      state.user.role = role;
      await loadData();
      renderApp();
    } catch(e) {
      alert('Login failed: ' + e.message);
    }
  });

  document.getElementById('show-register').addEventListener('click', (e) => {
    e.preventDefault();
    showRegister();
  });
}

function showRegister() {
  const appEl = document.getElementById('app');
  appEl.innerHTML = `
    <div class="auth-container">
      <div style="background:#059669;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px;color:#fff;font-weight:700">CG</div>
      <h1 style="font-size:22px;margin-bottom:4px">ClaimsGuard AI</h1>
      <p style="color:#94a3b8;font-size:13px;margin-bottom:24px">Create your account</p>
      <div class="auth-card">
        <h2>Register</h2>
        <p>Fill in your details</p>
        <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" placeholder="John Doe"></div>
        <div class="form-group"><label>Username</label><input type="text" id="reg-username" placeholder="johndoe"></div>
        <div class="form-group"><label>Email</label><input type="email" id="reg-email" placeholder="john@example.com"></div>
        <div class="form-group"><label>Phone</label><input type="text" id="reg-phone" placeholder="+91 9876543210"></div>
        <div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="Min 6 characters"></div>
        <div class="role-selector" id="reg-role-selector">
          <button class="role-btn active" data-role="customer">Customer</button>
          <button class="role-btn" data-role="officer">Claims Officer</button>
        </div>
        <button class="btn btn-primary" style="width:100%;padding:12px" id="reg-btn">Create Account</button>
        <p style="text-align:center;margin-top:12px;font-size:12px;color:#64748b">Already have an account? <a href="#" id="show-login" style="color:#10b981">Sign in</a></p>
      </div>
    </div>`;

  let role = 'customer';
  document.querySelectorAll('#reg-role-selector .role-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#reg-role-selector .role-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    role = b.dataset.role;
  }));

  document.getElementById('reg-btn').addEventListener('click', async () => {
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name || !username || !email || !password) return alert('Please fill all required fields');
    try {
      const res = await api('POST', '/api/auth/register', { username, fullName: name, email, phone, password, portalType: role });
      state.user = res.user;
      state.user.role = role;
      await loadData();
      renderApp();
    } catch(e) {
      alert('Registration failed: ' + e.message);
    }
  });

  document.getElementById('show-login').addEventListener('click', (e) => {
    e.preventDefault();
    renderLogin();
  });
}

// ─── Main App ───
function renderApp() {
  const u = state.user;
  document.getElementById('app').innerHTML = `
    <header>
      <h1>ClaimsGuard <span>AI</span></h1>
      <div class="user-badge">
        <span class="dot ${u.role}"></span>
        <span>${esc(u.name)}</span>
        <span style="font-size:11px;color:#64748b">${u.role === 'officer' ? 'Claims Officer' : 'Customer'}</span>
        <button class="logout-btn" id="logout-btn">Logout</button>
      </div>
    </header>
    <div class="container">
      ${u.role === 'customer' ? renderCustomerTabs() : renderOfficerTabs()}
      <div id="main-content"></div>
    </div>`;
  document.getElementById('logout-btn').addEventListener('click', () => { state.user = null; renderLogin(); });
  if (u.role === 'customer') { setupCustomerTabs(); showCustomerView(); }
  else { setupOfficerTabs(); showOfficerView(); }
}

// ─── Customer ───
function renderCustomerTabs() {
  const tabs = [
    { id: 'overview', label: 'My Claims' },
    { id: 'apply', label: 'Submit Claim' },
    { id: 'help', label: 'Help' },
    { id: 'chat', label: 'AI Assistant' },
    { id: 'settings', label: 'Settings' }
  ];
  return `<div class="tabs" id="cust-tabs">${tabs.map(t =>
    `<button class="tab-btn ${t.id === state.tab ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('')}</div>`;
}

function setupCustomerTabs() {
  document.querySelectorAll('#cust-tabs .tab-btn').forEach(b =>
    b.addEventListener('click', () => {

      document.querySelectorAll('#cust-tabs .tab-btn').forEach(x => x.classList.remove('active'));

function showCustomerView() {
  const mc = document.getElementById('main-content');
  switch(state.tab) {
    case 'overview': renderCustomerOverview(mc); break;
    case 'chat': renderCustomerChat(mc); break;
    case 'apply': renderApplyForm(mc); break;
    case 'help': renderHelp(mc); break;
    case 'settings': renderSettings(mc); break;
  }
}

function renderApplyForm(el) {
  el.innerHTML = `
    <div class="card">
      <h3>Submit a New Claim</h3>
      <div class="grid-2" style="margin-bottom:14px">
        <div class="form-group">
          <label>Claim Type</label>
          <select id="apply-type">
            <option value="auto">Auto</option>
            <option value="health">Health</option>
            <option value="property">Property</option>
            <option value="fire">Fire</option>
            <option value="theft">Theft</option>
            <option value="liability">Liability</option>
            <option value="travel">Travel</option>
          </select>
        </div>
        <div class="form-group">
          <label>Claim Amount (₹)</label>
          <input type="number" id="apply-amount" value="100000" min="1000" max="10000000">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Date of Incident</label>
          <input type="date" id="apply-incident">
        </div>
        <div class="form-group">
          <label>Policy Number</label>
          <input type="text" id="apply-policy" placeholder="POL-2024-XXXXX">
        </div>
      </div>
      <div class="form-group">
        <label>Loss Description</label>
        <textarea id="apply-purpose" rows="2" required placeholder="Describe the loss/incident, e.g. collision, water damage, theft..."></textarea>
      </div>
      <div style="border-top:1px solid #1e293b;padding-top:16px;margin-top:16px">
        <h3 style="margin-bottom:12px">Required Documents</h3>
        <p style="color:#f59e0b;font-size:12px;margin-bottom:12px">You must upload all three documents to begin processing your claim.</p>
        <div class="grid-3" style="margin-bottom:12px">
          <div class="form-group">
            <label>1. Claim Form (signed)</label>
            <input type="file" id="doc-claim-form" accept=".pdf,.jpg,.png" style="font-size:12px;padding:8px">
            <span id="doc-claim-form-status" style="font-size:11px;color:#64748b"></span>
          </div>
          <div class="form-group">
            <label>2. Policy Document</label>
            <input type="file" id="doc-policy" accept=".pdf,.jpg,.png" style="font-size:12px;padding:8px">
            <span id="doc-policy-status" style="font-size:11px;color:#64748b"></span>
          </div>
          <div class="form-group">
            <label>3. Proof of Loss</label>
            <input type="file" id="doc-proof" accept=".pdf,.jpg,.png" style="font-size:12px;padding:8px">
            <span id="doc-proof-status" style="font-size:11px;color:#64748b"></span>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" id="apply-submit" style="margin-top:8px" disabled>Upload &amp; Submit Claim</button>
      <span id="apply-error" style="color:#f43f5e;font-size:12px;margin-left:12px" class="hidden"></span>
    </div>`;

  function checkDocs() {
    const cf = document.getElementById('doc-claim-form').files[0];
    const pol = document.getElementById('doc-policy').files[0];
    const proof = document.getElementById('doc-proof').files[0];
    document.getElementById('apply-submit').disabled = !(cf && pol && proof);
    document.getElementById('doc-claim-form-status').textContent = cf ? cf.name : '';
    document.getElementById('doc-policy-status').textContent = pol ? pol.name : '';
    document.getElementById('doc-proof-status').textContent = proof ? proof.name : '';
  }

  document.getElementById('doc-claim-form').addEventListener('change', checkDocs);
  document.getElementById('doc-policy').addEventListener('change', checkDocs);
  document.getElementById('doc-proof').addEventListener('change', checkDocs);

  document.getElementById('apply-submit').addEventListener('click', async () => {
    const cfFile = document.getElementById('doc-claim-form').files[0];
    const polFile = document.getElementById('doc-policy').files[0];
    const proofFile = document.getElementById('doc-proof').files[0];

    if (!cfFile || !polFile || !proofFile) {
      document.getElementById('apply-error').textContent = 'Please upload all three required documents';
      document.getElementById('apply-error').classList.remove('hidden');
      return;
    }

    const lossDesc = document.getElementById('apply-purpose').value.trim();
    if (!lossDesc) {
      document.getElementById('apply-error').textContent = 'Please describe the loss/incident';
      document.getElementById('apply-error').classList.remove('hidden');
      return;
    }

    const errEl = document.getElementById('apply-error');
    errEl.classList.add('hidden');
    document.getElementById('apply-submit').disabled = true;
    document.getElementById('apply-submit').textContent = 'Submitting...';

    const payload = {
      claimantName: state.user.name,
      claimantEmail: state.user.email,
      claimantPhone: state.user.phone || '',
      policyNumber: document.getElementById('apply-policy').value.trim(),
      type: document.getElementById('apply-type').value,
      amount: parseFloat(document.getElementById('apply-amount').value) || 100000,
      incidentDate: document.getElementById('apply-incident').value || '',
      lossDescription: lossDesc,
      documents: [
        { name: cfFile.name, docType: 'claim_form' },
        { name: polFile.name, docType: 'policy_document' },
        { name: proofFile.name, docType: 'proof_of_loss' }
      ]
    };

    try {
      const res = await api('POST', '/api/claims', payload);
      const claim = res.claim;
      state.claims = [claim, ...state.claims];

      const claimId = claim.id;
      const formData = new FormData();
      formData.append('files', cfFile);
      formData.append('files', polFile);
      formData.append('files', proofFile);

      const uploadRes = await fetch(`${API}/api/claims/${claimId}/documents`, {
        method: 'POST',
        body: formData
      });

      if (uploadRes.ok) {
        const upData = await uploadRes.json();
        if (upData.claim) {
          state.claims = state.claims.map(c => c.id === claimId ? upData.claim : c);
        }
      }

      state.tab = 'overview';
      showCustomerView();
      document.querySelectorAll('#cust-tabs .tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === 'overview');
      });
    } catch(e) {
      errEl.textContent = 'Failed: ' + e.message;
      errEl.classList.remove('hidden');
      document.getElementById('apply-submit').disabled = false;
      document.getElementById('apply-submit').textContent = 'Upload & Submit Claim';
    }
  });
}

// ─── AI Chat ───
function renderCustomerChat(el) {
  if (!state.chatMessages) {
    state.chatMessages = [];
    state.chatLoading = false;
    state.activeGrounding = null;
  }

  function buildMsg(msg) {
    const isUser = msg.sender === 'user';
    return `<div class="chat-msg ${isUser ? 'user' : 'ai'}">
      <div class="avatar ${isUser ? 'user' : 'ai'}">${isUser ? '&#9993;' : '&#9881;'}</div>
      <div>
        <div class="bubble">${esc(msg.text)}</div>
        ${msg.sender === 'assistant' && msg.reasoning ? `
          <details class="reasoning-toggle">
            <summary><span>&#9654; AI Reasoning Chain</span></summary>
            <div class="reasoning-text">${esc(msg.reasoning)}</div>
          </details>` : ''}
        <div class="meta">
          <span class="timestamp">${msg.timestamp}</span>
          ${msg.policyGrounding ? `<span class="ground-link" data-ground="${msg.id}">View grounded clause &#8599;</span>` : ''}
        </div>
      </div>
    </div>`;
  }

  function renderSidebar() {
    const g = state.activeGrounding;
    if (!g) return '<p style="color:#64748b;font-size:11px;font-style:italic">Ask a question to see policy grounding.</p>';
    return `
      <div class="clause-box">
        <span class="clause-tag">Policy Clause</span>
        <div class="clause-name">${esc(g.clause)}</div>
        <div class="clause-doc">${esc(g.documentName)}</div>
        <div class="clause-text">"${esc(g.extractedText)}"</div>
        <div class="clause-auth">&#10003; Authorized reference policy source</div>
      </div>`;
  }

  el.innerHTML = `
    <div class="chat-container">
      <div class="chat-pane">
        <div class="chat-header">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="background:#1a1b3a;border:1px solid #4f46e5;color:#818cf8;padding:6px;border-radius:8px;font-size:16px">&#9881;</div>
            <div>
              <div style="font-weight:600;font-size:13px;color:#fff">ClaimsGuard AI Assistant</div>
              <div style="font-size:10px;color:#94a3b8"><span style="display:inline-block;width:8px;height:8px;background:#10b981;border-radius:50%;margin-right:4px"></span>Grounded by Insurance Policy</div>
            </div>
          </div>
          <span class="ai-badge">LLM</span>
        </div>
        <div class="chat-messages" id="chat-msg-container">
          ${state.chatMessages.map(buildMsg).join('')}
          ${state.chatLoading ? `<div class="chat-msg ai"><div class="avatar ai">&#9881;</div><div class="bubble" style="display:flex;align-items:center;gap:4px"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>&nbsp; Processing...</div></div>` : ''}
          ${state.chatMessages.length === 0 ? '<p style="color:#64748b;font-size:12px;text-align:center;margin-top:40px">Ask about your claim status, coverage, or next steps.</p>' : ''}
          <div id="chat-end"></div>
        </div>
        <form class="chat-input" id="chat-form">
          <input type="text" id="chat-input-field" placeholder="Ask about your claim..." autocomplete="off">
          <button type="submit" id="chat-send-btn" disabled>&#10148;</button>
        </form>
      </div>
      <div class="chat-sidebar">
        <h4>Policy Grounding</h4>
        <p style="font-size:10px;color:#64748b;margin-bottom:12px">Real-time reference from the active insurance policy.</p>
        <div style="flex:1">${renderSidebar()}</div>
      </div>
    </div>`;

  document.querySelectorAll('.ground-link').forEach(link => {
    link.addEventListener('click', () => {
      const id = link.dataset.ground;
      const msg = state.chatMessages.find(m => m.id === id);
      if (msg && msg.policyGrounding) {
        state.activeGrounding = msg.policyGrounding;
        renderCustomerChat(el);
      }
    });
  });

  const end = document.getElementById('chat-end');
  if (end) end.scrollIntoView();

  document.getElementById('chat-input-field').addEventListener('input', function() {
    document.getElementById('chat-send-btn').disabled = !this.value.trim();
  });

  document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('chat-input-field');
    const msg = input.value.trim();
    if (!msg || state.chatLoading) return;
    input.value = '';
    document.getElementById('chat-send-btn').disabled = true;

    state.chatMessages.push({
      id: 'msg-user-' + Date.now(),
      sender: 'user',
      text: msg,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    });
    state.chatLoading = true;
    renderCustomerChat(el);

    try {
      const res = await api('POST', '/api/chat', {
        message: msg,
        history: state.chatMessages.map(m => ({ role: m.sender === 'user' ? 'user' : 'model', text: m.text })),
        claimsContext: state.claims
      });
      state.chatMessages.push({
        id: 'msg-ai-' + Date.now(),
        sender: 'assistant',
        text: res.text || 'I analyzed your query. Please contact your claim officer for further details.',
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        reasoning: res.reasoning || '',
        policyGrounding: res.policyGrounding || null
      });
      if (res.policyGrounding) state.activeGrounding = res.policyGrounding;
    } catch(err) {
      state.chatMessages.push({
        id: 'msg-ai-err-' + Date.now(),
        sender: 'assistant',
        text: 'Sorry, I encountered an error. Please try again.',
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        reasoning: null,
        policyGrounding: null
      });
    }
    state.chatLoading = false;
    renderCustomerChat(el);
  });
}

    );
    el.innerHTML = `
      <div class="sidebar-layout">
        <div>
          <div class="form-group"><input type="text" id="queue-search" placeholder="Search claimant or ID..." value="${esc(state.search)}"></div>

      state.search = e.target.value;

    });
    document.querySelectorAll('[data-claim]').forEach(el2 => {
      el2.addEventListener('click', () => {
        state.selectedClaimId = el2.dataset.claim;
        renderOfficerQueue(el);
      });
    });
  });
}

        ${COVERAGE_BADGE[c.coverageStatus] || c.coverageStatus}
        ${FRAUD_BADGE[c.fraudLevel] || c.fraudLevel}
        <span style="margin-left:8px;font-size:13px">Fraud Score: ${c.fraudScore || 0}/100</span>
        ${c.needsHumanReview ? '<span class="badge badge-warning" style="margin-left:8px">Human Review Required</span>' : ''}
      </div>
      <div class="progress-bar"><div class="progress-fill green" style="width:${c.progress || 0}%"></div></div>
      ${c.humanReviewReason ? `<p style="font-size:12px;color:#f59e0b;margin-top:8px">${esc(c.humanReviewReason)}</p>` : ''}
      ${c.reasoningNotes ? `<p style="font-size:12px;color:#94a3b8;margin-top:8px">${esc(c.reasoningNotes)}</p>` : ''}
    </div>
    ${c.agentConsensus ? `
      <div class="grid-4" style="margin-bottom:16px">
        ${['documentValidation', 'policyInterpretation', 'fraudScreening', 'escalationDecision'].map(k => {
          const v = c.agentConsensus[k];
          if (!v) return '';
          return `<div class="card" style="padding:14px;text-align:center">
            <div style="font-size:10px;color:#818cf8;text-transform:uppercase;letter-spacing:.3px">${k.replace(/([A-Z])/g, ' $1')}</div>
            <div style="font-size:24px;font-weight:700;margin:6px 0;color:${v.status === 'pass' ? '#10b981' : v.status === 'warn' ? '#f59e0b' : '#f43f5e'}">${v.score}%</div>
            <div style="font-size:11px;color:#94a3b8">${esc(v.details)}</div>
          </div>`;
        }).join('')}
      </div>` : ''}
    ${c.documents && c.documents.length ? `
      <div class="card">
        <h3>Claim Documents</h3>
        <table>
          <thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Action</th><th>File</th></tr></thead>
          <tbody>
            ${c.documents.map(d => `
              <tr>
                <td>${esc(d.name)}</td>
                <td>${esc(d.type)}</td>
                <td><span class="badge ${d.status === 'valid' ? 'badge-success' : d.status === 'mismatch' ? 'badge-danger' : 'badge-warning'}">${d.status}</span></td>
                <td>
                  <select class="doc-status" data-claim="${c.id}" data-doc="${d.id}" style="width:auto;font-size:11px;padding:4px 8px">
                    <option value="valid" ${d.status === 'valid' ? 'selected' : ''}>Valid</option>
                    <option value="mismatch" ${d.status === 'mismatch' ? 'selected' : ''}>Mismatch</option>
                    <option value="pending" ${d.status === 'pending' ? 'selected' : ''}>Pending</option>
                  </select>
                </td>
                <td><a href="#" class="view-file" data-claim="${c.id}" data-name="${esc(d.name)}" style="color:#818cf8;font-size:12px">View</a></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>` : ''}
    ${c.similarCases && c.similarCases.length ? `
      <div class="card">
        <h3>Similar Historical Fraud Cases</h3>
        <table>
          <thead><tr><th>Case ID</th><th>Type</th><th>Similarity</th><th>Fraud Level</th><th>Resolution</th></tr></thead>
          <tbody>
            ${c.similarCases.map(sc => `
              <tr>
                <td class="font-mono" style="color:#818cf8">${esc(sc.case_id)}</td>
                <td>${esc(sc.case_type)}</td>
                <td class="font-mono"><span class="badge ${(sc.similarity || 0) >= 0.7 ? 'badge-danger' : (sc.similarity || 0) >= 0.5 ? 'badge-warning' : 'badge-success'}">${Math.round((sc.similarity || 0) * 100)}%</span></td>
                <td>${esc(sc.fraud_level)}</td>
                <td style="color:#94a3b8">${esc(sc.resolution)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>` : ''}
  `;
  setTimeout(() => {
    const appBtn = document.getElementById('btn-approve');
    const rejBtn = document.getElementById('btn-reject');
    if (appBtn) appBtn.addEventListener('click', () => handleOfficerAction(c.id, 'accept'));
    if (rejBtn) rejBtn.addEventListener('click', () => handleOfficerAction(c.id, 'reject'));
    document.querySelectorAll('.doc-status').forEach(sel => {
      sel.addEventListener('change', async () => {
        try {
          const updated = await api('PATCH', `/api/claims/${sel.dataset.claim}/documents/${sel.dataset.doc}`, { status: sel.value });
          state.claims = state.claims.map(c2 => c2.id === sel.dataset.claim ? updated : c2);
        } catch(e) { console.warn(e); }
      });
    });
    document.querySelectorAll('.view-file').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        showFileViewer(link.dataset.claim, link.dataset.name);
      });
    });
  }, 0);
  return html;
}

async function handleOfficerAction(id, action) {
  const btn = action === 'accept' ? document.getElementById('btn-approve') : document.getElementById('btn-reject');
  if (btn) { btn.disabled = true; btn.textContent = 'Processing...'; }
  try {
    const payload = { actor: state.user.name || 'Officer', reason: action === 'accept' ? 'Claim accepted by officer' : 'Claim rejected by officer' };
    const res = await api('PATCH', `/api/claims/${id}/${action}`, payload);
    state.claims = state.claims.map(c => c.id === id ? res.claim : c);
    if (res.auditLog) state.logs = [res.auditLog, ...state.logs];
    if (state.officerTab === 'admin') {
      renderOfficerAdmin(document.getElementById('main-content'));
    } else {
      renderOfficerQueue(document.getElementById('main-content'));
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = action === 'accept' ? 'Accept' : 'Reject'; }
    alert('Action failed: ' + e.message);
  }
}

// ─── Officer Logs ───
function renderOfficerLogs(el) {
  el.innerHTML = `<div class="spinner"></div>`;
  loadData().then(() => {
    el.innerHTML = `
      <div class="card">
        <div class="flex-between" style="margin-bottom:12px">
          <h3 style="margin:0">Claims Audit Ledger</h3>
          <span class="badge badge-success">Secured Pipeline Active</span>
        </div>
        <div style="max-height:500px;overflow-y:auto">
          ${state.logs.map(l => `
            <div style="background:#0f172a;padding:14px;border-radius:10px;border:1px solid #1e293b;margin-bottom:8px">
              <div class="flex-between">
                <div class="flex" style="gap:8px;align-items:center">
                  <span style="font-size:12px;font-weight:600">${esc(l.actor)}</span>
                  <span class="badge badge-info" style="font-size:9px">${esc(l.eventType)}</span>
                  <span class="badge ${l.riskLevel === 'high' ? 'badge-danger' : l.riskLevel === 'medium' ? 'badge-warning' : 'badge-success'}">${l.riskLevel}</span>
                </div>
                <span style="font-size:11px;color:#64748b;font-family:monospace">${esc(l.timestamp)}</span>
              </div>
              <p style="font-size:12px;color:#94a3b8;margin-top:6px">${esc(l.details)}</p>
            </div>
          `).join('')}
        </div>
      </div>`;
  });
}

// ─── Officer Admin ───
function renderOfficerAdmin(el) {
  el.innerHTML = `<div class="spinner"></div>`;
  loadData().then(() => renderAdminContent(el));
}

function renderAdminContent(el) {
  const sel = state.claims.find(c => c.id === state.selectedClaimId) || state.claims[0];
  if (sel) state.selectedClaimId = sel.id;
  const filtered = state.claims.filter(c =>
    !state.search || c.claimantName?.toLowerCase().includes(state.search.toLowerCase()) || c.id?.toLowerCase().includes(state.search.toLowerCase())
  );
  el.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3>Claims</h3>
      <div class="form-group" style="margin-bottom:8px"><input type="text" id="admin-app-search" placeholder="Search claimant or ID..." value="${esc(state.search)}"></div>
      <div class="sidebar-layout">
        <div style="max-height:300px;overflow-y:auto">
          ${filtered.map(c => `
            <div class="card" style="cursor:pointer;padding:10px;margin-bottom:4px;${state.selectedClaimId === c.id ? 'border-color:#4f46e5' : ''}" data-admin-claim="${c.id}">
              <div class="flex-between"><span style="font-size:10px;color:#64748b;font-family:monospace">${esc(c.id)}</span><span class="badge ${(c.fraudScore || 0) < 30 ? 'badge-success' : (c.fraudScore || 0) < 60 ? 'badge-warning' : 'badge-danger'}">Fraud ${c.fraudScore || 0}</span></div>
              <div style="font-size:12px;font-weight:600;margin-top:2px">${esc(c.claimantName || '')} - ${formatCurrency(c.amount)}</div>
              <span class="badge ${c.status === 'accepted' ? 'badge-success' : c.status === 'rejected' ? 'badge-danger' : 'badge-warning'}" style="margin-top:2px;font-size:9px">${c.status}</span>
            </div>
          `).join('')}
        </div>
        <div>
          ${sel ? renderOfficerDetail(sel) : '<p style="color:#64748b;text-align:center;padding:20px">Select a claim</p>'}
        </div>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">Manage Users</h3>
      <div style="max-height:400px;overflow-y:auto" id="admin-users-list"></div>
    </div>`;

  api('GET', '/api/users').then(res => {
    const list = document.getElementById('admin-users-list');
    if (!list) return;
    const users = (res.users || []).filter(u => u.username !== 'admin');
    list.innerHTML = users.map(u => `
      <div style="background:#0f172a;padding:10px;border-radius:8px;border:1px solid #1e293b;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <span style="font-size:13px;font-weight:600">${esc(u.name || u.username)}</span>
          <span class="badge badge-info" style="margin-left:4px">${esc(u.role)}</span>
          <div style="font-size:10px;color:#64748b;margin-top:2px">${esc(u.email)}</div>
        </div>
        <button class="btn btn-danger btn-sm del-user-btn" data-user="${u.username}">Remove</button>
      </div>
    `).join('');
    list.querySelectorAll('.del-user-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remove user ' + btn.dataset.user + '?')) return;
        try {
          await api('DELETE', '/api/users/' + btn.dataset.user);
          renderAdminContent(el);
        } catch(e) { alert('Failed: ' + e.message); }
      });
    });
  });

  const adminSearch = document.getElementById('admin-app-search');
  if (adminSearch) adminSearch.addEventListener('input', (e) => {
    state.search = e.target.value;
    renderOfficerAdmin(el);
  });
  document.querySelectorAll('[data-admin-claim]').forEach(el2 => {
    el2.addEventListener('click', () => {
      state.selectedClaimId = el2.dataset.adminClaim;
      renderOfficerAdmin(el);
    });
  });
}

// ─── Start ───
renderLogin();
</script>
</body>
</html>
