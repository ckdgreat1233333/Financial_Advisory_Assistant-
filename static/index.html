<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personalized Financial Advisory Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#e2e8f0;min-height:100vh}
header{background:#1e293b;border-bottom:1px solid #1e293b;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{color:#fff;font-size:18px;display:flex;align-items:center;gap:8px}
header h1 span{background:#4f46e5;color:#c7d2fe;font-size:10px;padding:2px 8px;border-radius:12px}
.user-badge{display:flex;align-items:center;gap:10px;font-size:13px}
.user-badge .dot{width:8px;height:8px;border-radius:50%}
.dot.customer{background:#10b981}
.dot.officer{background:#818cf8}
.logout-btn{background:#334155;color:#94a3b8;border:1px solid #334155;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.logout-btn:hover{background:#475569;color:#fff}
.container{max-width:1200px;margin:0 auto;padding:20px}
.hidden{display:none!important}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn-primary{background:#4f46e5;color:#fff}
.btn-primary:hover{background:#4338ca}
.btn-danger{background:#dc2626;color:#fff}
.btn-outline{background:#334155;color:#94a3b8;border:1px solid #475569}
.btn-sm{padding:5px 10px;font-size:11px}
.card{background:#1e293b;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:16px}
.card h3{font-size:14px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.flex{display:flex}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}
.text-xs{font-size:12px}.text-sm{font-size:13px}
.text-slate{color:#94a3b8}.text-white{color:#fff}
.text-emerald{color:#10b981}.text-rose{color:#f43f5e}.text-amber{color:#f59e0b}
.font-bold{font-weight:700}.font-mono{font-family:'Courier New',monospace}
.badge{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600;display:inline-block}
.badge-success{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.2)}
.badge-warning{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.badge-danger{background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.2)}
.badge-info{background:rgba(129,140,248,.15);color:#818cf8;border:1px solid rgba(129,140,248,.2)}
input,select,textarea{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#4f46e5}
label{font-size:12px;color:#94a3b8;display:block;margin-bottom:4px}
.auth-container{max-width:420px;margin:80px auto;text-align:center}
.auth-card{background:#1e293b;border:1px solid #1e293b;border-radius:16px;padding:32px;text-align:left;margin-top:20px}
.auth-card .logo{background:#4f46e5;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px}
.auth-card h2{text-align:center;font-size:20px;margin-bottom:4px}
.auth-card p{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:20px}
.role-selector{display:flex;gap:8px;margin-bottom:16px}
.role-btn{flex:1;padding:10px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;cursor:pointer;font-size:13px;text-align:center;transition:all .15s}
.role-btn.active{background:rgba(79,70,229,.15);border-color:#4f46e5;color:#818cf8;font-weight:600}
.form-group{margin-bottom:14px}
.tabs{display:flex;gap:4px;padding:4px;background:#0f172a;border-radius:10px;border:1px solid #1e293b;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:8px 14px;border-radius:8px;border:none;background:transparent;color:#94a3b8;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.tab-btn.active{background:#4f46e5;color:#fff}
.chat-container{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.chat-pane{background:#1e293b;border:1px solid #1e2a3a;border-radius:16px;overflow:hidden}
.chat-header{background:#0f172a;border-bottom:1px solid #1e2a3a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.chat-msg{display:flex;gap:10px;max-width:100%;align-items:flex-start}
.chat-msg.ai .bubble{background:#0f172a;color:#e2e8f0;border:1px solid #1e2a3a;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.7;word-break:break-word;white-space:pre-wrap}
.chat-msg .avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chat-msg .avatar.ai{background:#1a1b3a;border:1px solid #4f46e5;color:#818cf8}
.clause-box{background:#0f172a;border:1px solid #4f46e5;border-radius:10px;padding:14px;position:relative;margin-top:8px}
.clause-tag{position:absolute;right:8px;top:-8px;background:#1a1b3a;border:1px solid #4f46e5;color:#818cf8;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600}
.clause-text{font-size:11px;color:#94a3b8;font-style:italic;line-height:1.6}
.clause-auth{font-size:10px;color:#10b981;margin-top:6px}
@keyframes bounce{0%,100%{opacity:0.4}50%{opacity:1}}
.loading-dot{width:6px;height:6px;background:#818cf8;border-radius:50%;display:inline-block;animation:bounce .8s infinite}
.spinner{width:32px;height:32px;border:3px solid #1e293b;border-top-color:#4f46e5;border-radius:50%;animation:spin .6s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.query-box{background:#0f172a;border:1px solid #4f46e5;border-radius:14px;padding:18px;margin-bottom:16px}
.answer-block{background:#0f172a;border:1px solid #1e2a3a;border-radius:12px;padding:16px;margin-bottom:12px;line-height:1.7;font-size:13px;white-space:pre-wrap}
.conf-meter{height:8px;background:#1e293b;border-radius:6px;overflow:hidden;margin-top:6px}
.conf-fill{height:100%;border-radius:6px;transition:width .4s}
.conf-fill.high{background:#10b981}.conf-fill.medium{background:#f59e0b}.conf-fill.low{background:#f43f5e}
.escalate-banner{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:#fda4af}
.escalate-banner strong{color:#f43f5e}
.conflict-banner{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:#fcd34d}
.notfound-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:12px;padding:16px;font-size:13px;color:#fcd34d;line-height:1.6}
@media(max-width:768px){.chat-container,.grid-2,.grid-3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = 'http://127.0.0.1:8000';
let state = { user: null, view: 'login', officerTab: 'rm', customers: [], activeCustomer: null,
              activeProfile: null, rmResult: null, logs: [] };

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadLogs() {
  try {
    const l = await api('GET', '/api/audit-logs');
    state.logs = l.logs || [];
  } catch(e) { console.warn(e); }
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

// ─── Login / Register ───
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="auth-container">
      <div class="auth-card">
        <div class="logo">&#9878;</div>
        <h2>Personalized Financial Advisory Assistant</h2>
        <p>Banking domain · explainable, compliance-aligned guidance</p>
        <div class="role-selector" id="role-selector">
          <button class="role-btn" data-role="customer">Customer</button>
          <button class="role-btn active" data-role="officer">Relationship Manager</button>
        </div>
        <div class="form-group"><label>Username</label><input type="text" id="login-username" placeholder="username" value="admin"></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="password" value="admin123"></div>
        <button class="btn btn-primary" style="width:100%;padding:12px" id="login-btn">Sign In</button>
        <p style="text-align:center;margin-top:12px;font-size:12px;color:#64748b">New user? <a href="#" id="show-register" style="color:#818cf8">Create account</a></p>
        <p style="text-align:center;margin-top:16px;font-size:10px;color:#64748b;font-style:italic">"In financial advisory, explainability is more important than intelligence."</p>
      </div>
    </div>`;

  let role = 'officer';
  document.querySelectorAll('.role-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    role = b.dataset.role;
  }));

  document.getElementById('login-btn').addEventListener('click', async () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) return alert('Please enter username and password');
    try {
      const res = await api('POST', '/api/auth/login', { username, password, portalType: role });
      state.user = res.user;
      state.user.role = role;
      renderApp();
    } catch(e) { alert('Login failed: ' + e.message); }
  });

  document.getElementById('show-register').addEventListener('click', (e) => {
    e.preventDefault();
    showRegister();
  });
}

function showRegister() {
  document.getElementById('app').innerHTML = `
    <div class="auth-container">
      <div class="auth-card">
        <div class="logo">&#9878;</div>
        <h2>Create Account</h2>
        <p>Register for the advisory assistant</p>
        <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" placeholder="Jane Doe"></div>
        <div class="form-group"><label>Username</label><input type="text" id="reg-username" placeholder="janedoe"></div>
        <div class="form-group"><label>Email</label><input type="email" id="reg-email" placeholder="jane@example.com"></div>
        <div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="Min 6 characters"></div>
        <div class="role-selector" id="reg-role-selector">
          <button class="role-btn active" data-role="customer">Customer</button>
          <button class="role-btn" data-role="officer">Relationship Manager</button>
        </div>
        <button class="btn btn-primary" style="width:100%;padding:12px" id="reg-btn">Create Account</button>
        <p style="text-align:center;margin-top:12px;font-size:12px;color:#64748b">Already have an account? <a href="#" id="show-login" style="color:#818cf8">Sign in</a></p>
      </div>
    </div>`;

  let role = 'customer';
  document.querySelectorAll('#reg-role-selector .role-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#reg-role-selector .role-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    role = b.dataset.role;
  }));

  document.getElementById('reg-btn').addEventListener('click', async () => {
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name || !username || !email || !password) return alert('Please fill all required fields');
    try {
      await api('POST', '/api/auth/register', { username, fullName: name, email, password, portalType: role });
      const res = await api('POST', '/api/auth/login', { username, password, portalType: role });
      state.user = res.user;
      state.user.role = role;
      renderApp();
    } catch(e) { alert('Registration failed: ' + e.message); }
  });

  document.getElementById('show-login').addEventListener('click', (e) => {
    e.preventDefault();
    renderLogin();
  });
}

// ─── App shell ───
function renderApp() {
  const isRM = state.user.role !== 'customer';
  document.getElementById('app').innerHTML = `
    <header>
      <h1>&#9878; Personalized Financial Advisory Assistant <span>${isRM ? 'RM Decision Support' : 'Customer Guidance'}</span></h1>
      <div class="user-badge">
        <span class="dot ${isRM ? 'officer' : 'customer'}"></span>
        <span>${esc(state.user.name || state.user.username)}</span>
        <button class="logout-btn" id="logout-btn">Logout</button>
      </div>
    </header>
    <div class="container" id="main-content"></div>`;
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await api('POST', '/api/auth/logout').catch(() => {});
    state.user = null;
    renderLogin();
  });
  if (isRM) renderOfficerView();
  else renderCustomerView();
}

// ═══════ BUSINESS TRACK — RM DECISION SUPPORT ═══════
function renderOfficerView() {
  const tabs = [
    { id: 'rm', label: 'RM Advisory' },
    { id: 'logs', label: 'Advisory Audit Ledger' }
  ];
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div class="tabs" id="off-tabs">${tabs.map(t =>
    `<button class="tab-btn ${t.id === state.officerTab ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('')}</div><div id="off-body"></div>`;
  document.querySelectorAll('#off-tabs .tab-btn').forEach(b => b.addEventListener('click', () => {
    state.officerTab = b.dataset.tab;
    document.querySelectorAll('#off-tabs .tab-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    showOfficerTab();
  }));
  showOfficerTab();
}

function showOfficerTab() {
  const body = document.getElementById('off-body');
  if (state.officerTab === 'rm') renderRMAdvisory(body);
  else renderAuditLedger(body);
}

function verdictBadge(v) {
  const map = { eligible: 'badge-success', escalate: 'badge-warning', blocked: 'badge-danger' };
  return `<span class="badge ${map[v] || 'badge-info'}">${esc(String(v))}</span>`;
}

function riskBadge(r) {
  const map = { low: 'badge-success', moderate: 'badge-warning', high: 'badge-danger' };
  return `<span class="badge ${map[r] || 'badge-info'}">${esc(String(r))} risk</span>`;
}

function kycBadge(s) {
  return `<span class="badge ${s === 'verified' ? 'badge-success' : 'badge-danger'}">KYC ${esc(s)}</span>`;
}

async function ensureCustomers() {
  if (!state.customers.length) {
    const res = await api('GET', '/api/advisory/customers');
    state.customers = res.customers || [];
  }
}

function featChip(label, value) {
  return `<div style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:8px 10px">
    <div class="text-xs text-slate">${label}</div><div class="text-white font-bold text-sm">${value}</div></div>`;
}

function renderRMAdvisory(el) {
  el.innerHTML = `<div class="spinner"></div>`;
  ensureCustomers().then(() => {
    el.innerHTML = `
      <div class="chat-container">
        <div class="card">
          <h3>Customers</h3>
          <input type="text" id="cust-search" placeholder="Search name or ID..." class="mb-2">
          <div id="cust-list" style="max-height:560px;overflow-y:auto"></div>
        </div>
        <div id="rm-panel"><p class="text-sm text-slate">Select a customer to build their advisory profile.</p></div>
      </div>`;

    const drawList = (q) => {
      const items = state.customers.filter(c =>
        !q || (c.name || '').toLowerCase().includes(q) || (c.customer_id || '').toLowerCase().includes(q));
      document.getElementById('cust-list').innerHTML = items.slice(0, 80).map(c => `
        <div class="cust-row" data-cid="${esc(c.customer_id)}" style="padding:10px;border-radius:8px;border:1px solid #1e293b;margin-bottom:6px;cursor:pointer;background:${c.customer_id === state.activeCustomer ? 'rgba(79,70,229,.12)' : '#0f172a'}">
          <div class="flex-between">
            <span style="font-size:13px;font-weight:600">${esc(c.name)}</span>
            <span class="font-mono text-xs text-slate">${esc(c.customer_id)}</span>
          </div>
          <div class="flex mt-2" style="gap:6px;align-items:center;flex-wrap:wrap">
            <span class="badge badge-info">${esc(c.stated_risk_appetite)}</span>
            <span class="badge ${c.kyc_status === 'verified' ? 'badge-success' : 'badge-danger'}">${esc(c.kyc_status)}</span>
            <span class="text-xs text-slate">${esc(c.city)} · ${esc(String(c.age))}y</span>
          </div>
        </div>`).join('') || '<p class="text-xs text-slate">No matches.</p>';
      document.querySelectorAll('.cust-row').forEach(row =>
        row.addEventListener('click', () => selectCustomer(row.dataset.cid)));
    };
    drawList('');
    document.getElementById('cust-search').addEventListener('input', e => drawList(e.target.value.toLowerCase()));

    if (state.activeCustomer) selectCustomer(state.activeCustomer);
  }).catch(e => {
    el.innerHTML = `<div class="notfound-box">Advisory service unavailable: ${esc(e.message)}</div>`;
  });
}

async function selectCustomer(cid) {
  state.activeCustomer = cid;
  const panel = document.getElementById('rm-panel');
  if (!panel) return;
  panel.innerHTML = `<div class="spinner"></div>`;
  try {
    const res = await api('GET', '/api/advisory/customers/' + encodeURIComponent(cid) + '/profile');
    state.activeProfile = res;
  } catch(e) {
    panel.innerHTML = `<div class="notfound-box">Failed to load profile: ${esc(e.message)}</div>`;
    return;
  }
  document.querySelectorAll('.cust-row').forEach(r =>
    r.style.background = r.dataset.cid === cid ? 'rgba(79,70,229,.12)' : '#0f172a');
  renderRMPanel();
}

function renderRMPanel() {
  const data = state.activeProfile;
  const p = data && data.profile;
  const panel = document.getElementById('rm-panel');
  if (!panel || !p) return;
  panel.innerHTML = `
    <div class="card">
      <div class="flex-between mb-2">
        <h3 style="margin:0">${esc(p.name)} <span class="text-xs text-slate font-mono">${esc(p.customer_id)}</span></h3>
        <div class="flex" style="gap:6px">
          ${kycBadge(p.kyc_status)}
          <span class="badge badge-info">${esc(p.segment || 'unsegmented')}</span>
        </div>
      </div>
      <p class="text-sm text-slate" style="line-height:1.7">${esc(data.summary)}</p>
      ${p.risk_alignment_note ? `<div class="conflict-banner mt-3">${esc(p.risk_alignment_note)}</div>` : ''}
      <div class="grid-3 mt-3">
        ${featChip('Savings rate', Math.round((p.savings_rate || 0) * 100) + '%')}
        ${featChip('Monthly surplus', '&#8377;' + Number(p.monthly_surplus || 0).toLocaleString('en-IN'))}
        ${featChip('Emergency buffer', (p.emergency_buffer_months || 0).toFixed(1) + ' mo')}
        ${featChip('EMI burden', Math.round((p.emi_burden || 0) * 100) + '%')}
        ${featChip('Computed capacity', esc(p.computed_risk_capacity || ''))}
        ${featChip('Life stage', esc((p.life_stage || '').replace(/_/g, ' ')))}
      </div>
      ${p.protection_gap ? '<div class="conflict-banner mt-3">Protection gap detected: no life or health cover on record. Cover-first guidance advised.</div>' : ''}
      ${p.first_time_investor ? '<div class="mt-2"><span class="badge badge-warning">First-time investor</span></div>' : ''}
    </div>
    <div class="query-box">
      <div class="flex-between mb-2">
        <h3 style="margin:0;color:#818cf8">Advisory Query</h3>
        <span class="badge badge-info">engine decides · AI explains</span>
      </div>
      <div class="flex" style="gap:8px">
        <textarea id="rm-query-input" rows="2" placeholder="e.g. Which products suit this customer for retirement planning?" style="flex:1"></textarea>
        <button class="btn btn-primary" id="rm-query-btn" style="align-self:stretch">Advise</button>
      </div>
    </div>
    <div id="rm-result"></div>`;

  if (state.rmResult && state.rmResult.customer_id === p.customer_id) {
    renderRmResult(document.getElementById('rm-result'), state.rmResult);
  }

  document.getElementById('rm-query-btn').addEventListener('click', async () => {
    const q = document.getElementById('rm-query-input').value.trim();
    if (!q) return alert('Enter an advisory question for this customer.');
    const btn = document.getElementById('rm-query-btn');
    btn.disabled = true; btn.textContent = 'Analyzing…';
    try {
      const res = await api('POST', '/api/advisory/rm-query', { customer_id: p.customer_id, question: q });
      state.rmResult = res;
      renderRmResult(document.getElementById('rm-result'), res);
    } catch(e) { alert('Failed: ' + e.message); }
    btn.disabled = false; btn.textContent = 'Advise';
  });
}

function recCard(r) {
  const scoreCls = r.score >= 0.66 ? 'high' : r.score >= 0.4 ? 'medium' : 'low';
  return `
    <div style="background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-bottom:8px">
      <div class="flex-between mb-2">
        <div class="flex" style="gap:6px;align-items:center">
          <strong style="font-size:13px;color:#fff">${esc(r.name)}</strong>
          ${riskBadge(r.risk_level)}${verdictBadge(r.verdict)}
        </div>
        <span class="font-mono text-xs text-slate">score ${(r.score * 100).toFixed(0)}%</span>
      </div>
      <div class="conf-meter"><div class="conf-fill ${scoreCls}" style="width:${Math.round(r.score * 100)}%"></div></div>
      ${(r.reasons || []).map(x => `<p class="text-xs text-rose mt-2">&#10007; ${esc(x)}</p>`).join('')}
      ${(r.warnings || []).map(x => `<p class="text-xs text-amber mt-2">&#9888; ${esc(x)}</p>`).join('')}
      ${(r.citation_refs && r.citation_refs.length)
        ? `<div class="flex mt-2" style="gap:4px;flex-wrap:wrap">${r.citation_refs.map(cr =>
            `<span class="badge badge-info font-mono" style="font-size:9px">${esc(cr)}</span>`).join('')}</div>`
        : ''}
    </div>`;
}

function renderRmResult(el, res) {
  if (!el) return;
  const recs = res.recommendations || [];
  const eligible = recs.filter(r => r.verdict === 'eligible');
  const escalated = recs.filter(r => r.verdict === 'escalate');

  el.innerHTML = `
    ${res.needs_human_override ? `
      <div class="escalate-banner"><strong>&#9888; Human override required</strong>${res.escalation_reason ? ' — ' + esc(res.escalation_reason) : ''}
        <div class="text-xs mt-2">Escalated items may only be presented to the customer after documented supervisor approval (SEBI suitability obligation).</div>
      </div>` : ''}
    <div class="card">
      <h3>Recommendation Summary</h3>
      <div class="answer-block">${esc(res.narrative || '')}</div>
      ${(res.compliance_notes && res.compliance_notes.length)
        ? `<h3>Risk Flags</h3>` + res.compliance_notes.map(n =>
            `<p class="text-xs text-amber mb-2">&#9888; ${esc(n)}</p>`).join('')
        : ''}
    </div>
    <div class="card">
      <div class="flex-between mb-2">
        <h3 style="margin:0">Suitable Products (${eligible.length})</h3>
        <span class="text-xs text-slate">verdicts computed by deterministic suitability engine</span>
      </div>
      ${eligible.map(recCard).join('') || '<p class="text-xs text-slate">No eligible products for this query.</p>'}
    </div>
    ${escalated.length ? `<div class="card"><h3>Escalations (${escalated.length})</h3>${escalated.map(recCard).join('')}</div>` : ''}
    <div class="notfound-box" style="border-color:rgba(129,140,248,.35);color:#a5b4fc">${esc((res.disclaimers || [])[0] || '')}</div>`;

  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderAuditLedger(el) {
  el.innerHTML = `<div class="spinner"></div>`;
  loadLogs().then(() => {
    el.innerHTML = `
      <div class="card">
        <div class="flex-between mb-3">
          <h3 style="margin:0">Advisory Audit Ledger</h3>
          <span class="badge badge-success">Accountability Trail</span>
        </div>
        <div style="max-height:600px;overflow-y:auto">
          ${state.logs.map(l => `
            <div style="background:#0f172a;padding:14px;border-radius:10px;border:1px solid #1e293b;margin-bottom:8px">
              <div class="flex-between">
                <div class="flex" style="gap:8px;align-items:center">
                  <span style="font-size:12px;font-weight:600">${esc(l.actor)}</span>
                  <span class="badge badge-info" style="font-size:9px">${esc(l.eventType)}</span>
                  <span class="badge ${l.riskLevel === 'high' ? 'badge-danger' : l.riskLevel === 'medium' ? 'badge-warning' : 'badge-success'}">${esc(l.riskLevel)}</span>
                </div>
                <span style="font-size:11px;color:#64748b;font-family:monospace">${esc(l.timestamp)}</span>
              </div>
              <p style="font-size:12px;color:#94a3b8;margin-top:6px">${esc(l.details)}</p>
            </div>`).join('') || '<p class="text-xs text-slate">No entries yet.</p>'}
        </div>
      </div>`;
  });
}

// ═══════ CUSTOMER TRACK — GOAL-BASED GUIDANCE ═══════
const GOALS = [
  { id: 'education', label: "Children's Education" },
  { id: 'retirement', label: 'Retirement Corpus' },
  { id: 'wealth', label: 'Wealth Creation' },
  { id: 'safety', label: 'Emergency & Safety Buffer' },
  { id: 'tax', label: 'Tax Saving' }
];

function renderCustomerView() {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `<div id="cust-body"></div>`;
  renderGoalAdvisory(document.getElementById('cust-body'));
}

function renderGoalAdvisory(el) {
  el.innerHTML = `<div class="spinner"></div>`;
  ensureCustomers().then(() => {
    el.innerHTML = `
      <div class="chat-container">
        <div>
          <div class="card">
            <h3>Your Profile</h3>
            <label>Acting as customer (demo)</label>
            <select id="goal-cust">${state.customers.map(c =>
              `<option value="${esc(c.customer_id)}">${esc(c.name)} · ${esc(c.customer_id)}</option>`).join('')}</select>
          </div>
          <div class="card">
            <h3>Your Goal</h3>
            <div class="form-group">
              <label>What are you saving for?</label>
              <select id="goal-select">${GOALS.map(g => `<option value="${g.id}">${esc(g.label)}</option>`).join('')}</select>
            </div>
            <div class="form-group"><label>Amount available (optional, ₹)</label><input type="number" id="goal-amount" placeholder="e.g. 50000" min="0"></div>
            <button class="btn btn-primary" style="width:100%" id="goal-btn">Get Guidance</button>
          </div>
          <div class="clause-box">
            <span class="clause-tag">Safe by design</span>
            <div class="clause-text">Guidance is personalized to your verified profile. High-risk products are filtered out or escalated to a human advisor automatically. This is guidance, not investment advice.</div>
            <div class="clause-auth">&#10003; Non-promissory language enforced</div>
          </div>
        </div>
        <div id="goal-result"><p class="text-sm text-slate">Choose a goal and press "Get Guidance" to receive personalized, compliance-checked guidance.</p></div>
      </div>`;

    document.getElementById('goal-btn').addEventListener('click', async () => {
      const cid = document.getElementById('goal-cust').value;
      const goal = document.getElementById('goal-select').value;
      const amountRaw = document.getElementById('goal-amount').value;
      const amount = amountRaw ? parseFloat(amountRaw) : null;
      const btn = document.getElementById('goal-btn');
      btn.disabled = true; btn.textContent = 'Preparing guidance…';
      const resultEl = document.getElementById('goal-result');
      resultEl.innerHTML = `<div class="chat-pane" style="padding:40px;text-align:center"><span class="loading-dot"></span> <span class="loading-dot"></span> <span class="loading-dot"></span>&nbsp; Preparing your personalized guidance…</div>`;
      try {
        const res = await api('POST', '/api/advisory/customer-goal',
          { customer_id: cid, goal, amount });
        renderGoalResult(resultEl, res);
      } catch(e) {
        resultEl.innerHTML =
          `<div class="notfound-box">Could not prepare guidance: ${esc(e.message)}</div>`;
      }
      btn.disabled = false; btn.textContent = 'Get Guidance';
    });
  }).catch(e => {
    el.innerHTML = `<div class="notfound-box">Advisory service unavailable: ${esc(e.message)}</div>`;
  });
}

function renderGoalResult(el, res) {
  const recs = res.recommendations || [];
  el.innerHTML = `
    <div class="chat-pane" style="padding:0">
      <div class="chat-header">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="background:#1a1b3a;border:1px solid #4f46e5;color:#818cf8;padding:6px;border-radius:8px;font-size:16px">&#9878;</div>
          <div>
            <div style="font-weight:600;font-size:13px;color:#fff">Personalized Guidance</div>
            <div style="font-size:10px;color:#94a3b8"><span style="display:inline-block;width:8px;height:8px;background:#10b981;border-radius:50%;margin-right:4px"></span>Suitability-checked · risk-aware</div>
          </div>
        </div>
        <span class="badge badge-info" style="font-size:9px">${esc(res.goal || '')}</span>
      </div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:14px">
        <div class="chat-msg ai"><div class="avatar ai">&#9878;</div><div class="bubble">${esc(res.narrative || '')}</div></div>
        ${recs.length ? `
          <div>
            <h4 style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Options the system found suitable for you</h4>
            <div class="flex" style="gap:6px;flex-wrap:wrap">
              ${recs.map(r => `<span class="badge badge-success" style="padding:6px 12px;font-size:11px">&#10003; ${esc(r.name)}</span>`).join('')}
            </div>
          </div>` : `<p class="text-xs text-amber">No products could be confirmed suitable right now — please consult a relationship manager.</p>`}
        <div style="background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:12px">
          ${(res.disclaimers || []).map(d => `<p class="text-xs text-amber mb-2" style="line-height:1.6">&#9878; ${esc(d)}</p>`).join('')}
        </div>
      </div>
    </div>`;
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
